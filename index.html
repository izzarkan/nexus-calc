<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Calculator</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <!-- Calc -->
     
    <div class="calculator-container" id="calculator-container">
        <h1>Nexus Calculator</h1>
        <input type="text" id="display" disabled>
        <!-- A button to open the modal -->
        <button id="open-modal-btn">Open Conversion</button>
        <div class="calculator">

            <div class="button-grid">
                <div class="button"><button>C</button></div>
                <div class="button"><button>←</button></div>
                <div class="button"><button>%</button></div>
                <div class="button"><button>÷</button></div>

                <div class="button"><button>7</button></div>
                <div class="button"><button>8</button></div>
                <div class="button"><button>9</button></div>
                <div class="button"><button>×</button></div>

                <div class="button"><button>4</button></div>
                <div class="button"><button>5</button></div>
                <div class="button"><button>6</button></div>
                <div class="button"><button>-</button></div>

                <div class="button"><button>1</button></div>
                <div class="button"><button>2</button></div>
                <div class="button"><button>3</button></div>
                <div class="button"><button>+</button></div>

                <div class="button"><button>0</button></div>
                <div class="button"><button>.</button></div>
                <div class="button equal"><button>=</button></div>
            </div>
        </div>
    </div>
    <!-- Conversion -->
    <!-- Modal Container -->
    <div id="conversion-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2 class="ucon-title">Unit Conversion</h2>
            <div id="conversion-container">
                <!-- Conversion type selection -->
                <select id="conversion-type">
                    <option value="time">Time</option>
                    <option value="length">Length</option>
                </select>
                <input type="number" id="convert-value" placeholder="Enter value" />
                <!-- Unit selections -->
                <select id="unit-from">
                </select>
                <span>→</span>
                <select id="unit-to">
                </select>
                <button id="convert-btn">Convert</button>
                <input type="text" id="conversion-result" readonly placeholder="Result" />
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-container">
        <p>Site made with <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red" class="bi bi-suit-heart-fill" viewBox="0 0 16 16">
            <path d="M4 1c2.21 0 4 1.755 4 3.92C8 2.755 9.79 1 12 1s4 1.755 4 3.92c0 3.263-3.234 4.414-7.608 9.608a.513.513 0 0 1-.784 0C3.234 9.334 0 8.183 0 4.92 0 2.755 1.79 1 4 1"/>
            </svg> by [hyperlink blocked]</p>
        <div class="footer-links">
          <a href="https://github.com/izzarkan/nexus-calc" target="_blank" style="color: crimson;">Source code</a>
          <a href="mailto:Arkanizzzaydanmaulana@gmail.com">Contact Me</a>
          <a href="https://izzarkan.github.io/">Home</a>
        </div>
      </div>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
